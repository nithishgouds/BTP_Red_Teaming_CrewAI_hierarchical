[project]
name = "btp-usecase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Santhosh-Reddy-G", email = "santhoshreddygogula1414@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "crewai>=0.80.0",
    "ollama>=0.6.2",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.17.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[project.scripts]
btp-usecase = "btp_usecase:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
